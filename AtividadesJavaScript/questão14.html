<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idade</title>
</head>
<body>
    <h1>Descubra quantos dias de vida você tem</h1>
    <script>
        let anos = parseInt(prompt("Digite quantos anos você tem: "));
        let meses = parseInt(prompt("Digite quantos meses (além dos anos): "));
        let dias = parseInt(prompt("Digite quantos dias (além dos anos e meses): "));

        let totalDias = (anos * 365) + (meses * 30) + dias;

        document.write("Foi informado que você tem " + anos + " anos, " + meses + " meses e " + dias + " dias.<br>");
        document.write("Portanto, você tem aproximadamente " + totalDias + " dias de vida.");

    </script>
</body>
</html>
