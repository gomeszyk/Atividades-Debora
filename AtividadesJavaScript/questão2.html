<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área e Perímetro de um círculo</title>
</head>
<body>
    <h1> Descubra o Raio da Circunferência</h1>

    <script>
        let raio = parseInt(prompt("Digite o raio do círculo: "))
        
        let area = Math.PI * raio **2
        let perimetro = 2 * Math.PI * raio

        document.write("A área é igual à: " + area.toFixed(2) + "<br>")
        document.write("O perímetro é igual à: " + perimetro.toFixed(2))

    </script>



</body>
</html>
