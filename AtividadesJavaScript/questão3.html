<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área de um Triângulo</title>
</head>
<body>
    <h1>Descruba a área do Triângulo</h1>

    <script>
        let base = parseInt(prompt("Digite a área do triângulo: "))
        let altura = parseInt(prompt("Digite a altura do triângulo: "))

        let area = (base * altura) /2

        document.write("A base do triângulo é: " + base + "<br>")
        document.write("A altura do triângulo é: " + altura + "<br>")
        document.write("A área do triãngulo é: " + area)

    </script>
</body>
</html>
