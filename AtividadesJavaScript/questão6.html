<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par ou ímpar?</title>
</head>
<body>
    <h1>Par ou ímpar?</h1>
    <script>
        let numero = parseInt(prompt("Digite um número: "));
        if (numero % 2 === 0) {
            document.write("O número é par.");
        } else {
            document.write("O número é ímpar.");
        }
    </script>
</body>
</html>
