<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valor trocado</title>
</head>
<body>
    <h1>Escreva 2 números e veja eles trocarem de valor</h1>
    <script>
        let num1 = parseFloat(prompt("Digite o primeiro número: "));
        let num2 = parseFloat(prompt("Digite o segundo número: "));

        // Troca de valores
        let temp = num1; // Variável que guarda o valor do primeiro número
        num1 = num2;
        num2 = temp;

        document.write("Após a troca de valores:<br>");
        document.write("Primeiro número: " + num1 + "<br>");
        document.write("Segundo número: " + num2);
    </script>
</body>
</html>
