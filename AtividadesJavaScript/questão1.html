<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operações Matemáticas</title>
</head>
<body>
    <h1>Operções Matemáticas</h1>

    <script>
        let n1 = parseInt(prompt("Digite o primeiro número: "))
        let n2 = parseInt(prompt("Digite o segundo número: "))
        document.write ("O primeiro número inserido foi: " + n1 + "<br>")
        document.write ("O segundo número inserido foi: " + n2 + "<br>" + "<br>")

        let soma = n1 + n2
        let subtracao = n1 - n2
        let mult = n1 * n2
        let divisao = n1 / n2

        document.write("A soma dos números é: " + soma + "<br>")
        document.write("A subtração dos números é: " + subtracao + "<br>")
        document.write("A multiplicação dos números é: " + mult + "<br>")
        document.write("A divisão dos números é: " + divisao.toFixed(2) + "<br>")

    </script>
</body>
</html>
