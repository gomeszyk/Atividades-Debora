<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação dos números</title>
</head>
<body>
    <h1> O número é positivo, negativo ou zero?</h1>
    <script>
        let numero = parseInt(prompt("Digite um número: "))

        if(numero >0){
            document.write("O número digitado é positivo!")
        }

        else if(numero <0){
            document.write("O número digitado é negativo!")
        }
        
        else {
            document.write("O número digitado é zero!")
        }

        
    </script>
</body>
</html>
